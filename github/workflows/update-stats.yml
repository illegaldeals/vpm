name: Update delay stats

on:
  schedule:
    # jeden Montag um 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch: {}   # erlaubt manuelles Anstoßen über den "Run workflow"-Button

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow requests

      - name: Run aggregation
        run: python aggregate_delays.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add delay_stats.json
          git diff --quiet --cached || git commit -m "Update delay stats"
          git push
